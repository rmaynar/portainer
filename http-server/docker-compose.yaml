services:
  web:
    image: nginx:alpine
    container_name: my-web-server
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      # Mounts html directory to NGINX web root (read-only)
      - ./html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

