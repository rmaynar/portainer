services:
  web:
    image: nginx:alpine
    container_name: my-web-server
    restart: unless-stopped
    ports:
      - "${PORT:-8888}:80"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      # Mounts personal site HTML directory to NGINX web root (read-only)
      # Set HTML_PATH in your local .env file (see .env.example)
      - ${HTML_PATH:-./html}:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
